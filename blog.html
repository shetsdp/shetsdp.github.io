<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Blog Home</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .blog-list { display: flex; flex-wrap: wrap; gap: 24px; }
        .blog-card {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 24px;
            width: 300px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: box-shadow 0.2s;
        }
        .blog-card:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        }
        .blog-title {
            font-size: 1.3em;
            margin-bottom: 12px;
        }
        .blog-desc {
            color: #555;
            margin-bottom: 16px;
        }
        .blog-link {
            text-decoration: none;
            color: #0077cc;
            font-weight: bold;
        }
        .blog-link:hover {
            text-decoration: underline;
        }
    </style>

    <script>
fetch('https://api.countapi.xyz/hit/mywebsite/visits')
.then(response => response.json())
.then(data => {
document.getElementById("visits").innerText = data.value;
});
</script>
</head>
<body>
    <h1>Welcome to My Blog</h1>
    <div class="blog-list">
        <div class="blog-card">
            <div class="blog-title">Blog Post One</div>
            <div class="blog-desc">A short description about the first blog post.</div>
            <a class="blog-link" href="blog1.html">Read More</a>
        </div>
        <div class="blog-card">
            <div class="blog-title">Blog Post Two</div>
            <div class="blog-desc">Insights and thoughts in the second blog post.</div>
            <a class="blog-link" href="blog2.html">Read More</a>
        </div>
        <div class="blog-card">
            <div class="blog-title">Blog Post Three</div>
            <div class="blog-desc">Discover ideas in the third blog post.</div>
            <a class="blog-link" href="blog3.html">Read More</a>
        </div>
        <div class="blog-card">
            <div class="blog-title">Blog Post Four</div>
            <div class="blog-desc">Explore the fourth blog post for more content.</div>
            <a class="blog-link" href="blog4.html">Read More</a>
        </div>
    </div>
    


<img src="https://visitor-badge.laobi.icu/badge?page_id=mywebsite">
</body>
</html>
